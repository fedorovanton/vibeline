<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 912 624" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="aigw-architecture-title aigw-architecture-desc">
      <title id="aigw-architecture-title">Архитектура ai-gateway</title>
      <desc id="aigw-architecture-desc">Запрос потребителя проходит аутентификацию, лексер и детекцию, политику потребителя, маскирование и запись соответствия в хранилище внутри границы доверия; наружу в модель AlfaGen текст уходит только через точку выпуска internal/llm, а ответ модели демаскируется и возвращается потребителю, при этом контракт /process и явный API модель не вызывают.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Граница доверия (зона рисуется до стрелок и узлов) -->
      <rect x="208" y="80" width="672" height="336" rx="8"
            fill="rgba(235,108,54,0.03)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
      <rect x="440" y="74" width="208" height="12" rx="2" fill="#f5f5f5"/>
      <text x="544" y="83" fill="rgba(235,108,54,0.80)" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">ГРАНИЦА ДОВЕРИЯ · AI-GATEWAY</text>

      <!-- ── Стрелки ─────────────────────────────────────────── -->

      <!-- 1. Потребитель → аутентификация -->
      <line x1="176" y1="164" x2="238" y2="164" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="188" y="144" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="208" y="153" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTP</text>

      <!-- 2–4. Конвейер защиты -->
      <line x1="368" y1="164" x2="398" y2="164" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="528" y1="164" x2="558" y2="164" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="688" y1="164" x2="718" y2="164" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- 5. Маскирование → хранилище: запись до ответа -->
      <line x1="784" y1="200" x2="784" y2="278" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="792" y="232" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="796" y="241" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">СНАЧАЛА ЗАПИСЬ</text>

      <!-- 6. Хранилище → точка выпуска (только /v1/chat/completions) -->
      <line x1="720" y1="316" x2="690" y2="316" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- 7. Точка выпуска → LLM: единственный выход наружу -->
      <line x1="624" y1="352" x2="624" y2="470" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="532" y="440" width="84" height="12" rx="2" fill="#f5f5f5"/>
      <text x="612" y="449" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">ТОЛЬКО МАСКА</text>

      <!-- 8. Ответ модели → демаскирование -->
      <path d="M 560,508 H 444 Q 436,508 436,500 V 354" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="452" y="488" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="497" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ОТВЕТ МОДЕЛИ</text>

      <!-- 9. Контур без модели: /process и /api/v1/* (мост над стрелкой 7) -->
      <path d="M 784,352 V 384 Q 784,392 776,392 H 632 a 8,8 0 0,0 -16,0 H 492 Q 484,392 484,384 V 354"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="660" y="372" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="708" y="381" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">БЕЗ МОДЕЛИ</text>

      <!-- 10. Ответ потребителю -->
      <line x1="400" y1="316" x2="178" y2="316" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="264" y="296" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="288" y="305" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ОТВЕТ</text>

      <!-- ── Узлы ────────────────────────────────────────────── -->

      <!-- Потребители (вход) -->
      <rect x="24" y="128" width="152" height="224" rx="6" fill="#f5f5f5"/>
      <rect x="24" y="128" width="152" height="224" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="32" y="134" width="24" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.60)" stroke-width="0.8"/>
      <text x="44" y="143" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IN</text>
      <text x="100" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Потребители</text>
      <text x="100" y="196" fill="#2d3142" font-size="9" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">проверяющая система</text>
      <text x="100" y="210" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">POST /process</text>
      <text x="100" y="222" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">без ключа → benchmark</text>
      <text x="100" y="256" fill="#2d3142" font-size="9" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">продуктовые системы</text>
      <text x="100" y="270" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/v1/chat/completions</text>
      <text x="100" y="282" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/api/v1/mask, unmask</text>
      <text x="100" y="294" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ключ X-API-Key</text>

      <!-- Аутентификация -->
      <rect x="240" y="128" width="128" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="240" y="128" width="128" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="248" y="134" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="262" y="143" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="304" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Аутентификация</text>
      <text x="304" y="178" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">internal/httpapi</text>
      <text x="304" y="190" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ключ → потребитель</text>

      <!-- Лексер и детекция -->
      <rect x="400" y="128" width="128" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="400" y="128" width="128" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="408" y="134" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="418" y="143" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">1</text>
      <text x="464" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Лексер, детекция</text>
      <text x="464" y="178" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">internal/lex, detect</text>
      <text x="464" y="190" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">сканеры, контр-правила</text>

      <!-- Политика -->
      <rect x="560" y="128" width="128" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="128" width="128" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="568" y="134" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="578" y="143" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">2</text>
      <text x="624" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Политика</text>
      <text x="624" y="178" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">internal/policy</text>
      <text x="624" y="190" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">типы, комбинации</text>

      <!-- Маскирование -->
      <rect x="720" y="128" width="128" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="720" y="128" width="128" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="728" y="134" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="738" y="143" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">3</text>
      <text x="784" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Маскирование</text>
      <text x="784" y="178" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">internal/mask</text>
      <text x="784" y="190" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">4 стратегии замены</text>

      <!-- Хранилище соответствий -->
      <rect x="720" y="280" width="128" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="720" y="280" width="128" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="728" y="286" width="20" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="738" y="295" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">4</text>
      <text x="784" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Хранилище</text>
      <text x="784" y="330" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">internal/store</text>
      <text x="784" y="342" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">память, TTL, область</text>

      <!-- Точка выпуска (фокус) -->
      <rect x="560" y="280" width="128" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="280" width="128" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="568" y="286" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="582" y="295" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
      <text x="624" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Точка выпуска</text>
      <text x="624" y="330" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">internal/llm</text>
      <text x="624" y="342" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">отказ → 0 запросов</text>

      <!-- Демаскирование и ответ -->
      <rect x="400" y="280" width="128" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="400" y="280" width="128" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="408" y="286" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="418" y="295" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">5</text>
      <text x="464" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Демаскирование</text>
      <text x="464" y="330" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">internal/gateway</text>
      <text x="464" y="342" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">только свои маски</text>

      <!-- LLM AlfaGen (внешняя система) -->
      <rect x="560" y="472" width="128" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="472" width="128" height="72" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="568" y="478" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="582" y="487" fill="rgba(45,49,66,0.60)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="624" y="508" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LLM AlfaGen</text>
      <text x="624" y="522" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">llm.mode: alfagen</text>
      <text x="624" y="534" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">или stub без сети</text>

      <!-- ── Легенда ─────────────────────────────────────────── -->
      <line x1="24" y1="572" x2="888" y2="572" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="24" y="600" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ЛЕГЕНДА</text>

      <line x1="96" y1="596" x2="124" y2="596" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="132" y="600" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">запрос и ответ</text>

      <line x1="224" y1="596" x2="252" y2="596" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="260" y="600" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">выход наружу</text>

      <line x1="344" y1="596" x2="372" y2="596" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="380" y="600" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">ответ внешней системы</text>

      <line x1="504" y1="596" x2="532" y2="596" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="540" y="600" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">/process, /api/v1/*</text>

      <rect x="652" y="590" width="20" height="12" rx="2" fill="rgba(235,108,54,0.03)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="680" y="600" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">граница доверия</text>

      <rect x="776" y="590" width="20" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="804" y="600" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">состояние</text>
    </svg>
