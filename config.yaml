# Конфигурация ai-gateway.
#
# Настройка выполняется правкой этого файла и перезагрузкой по сигналу:
#   kill -HUP $(pgrep ai-gateway)
# Невалидный файл отклоняется, и сервис продолжает работать на прежних
# настройках. Ключи доступа в файле не хранятся: указывается только имя
# переменной окружения.

server:
  addr: ":8080"
  # Запас на вход до 100 000 токенов: кириллическая буква занимает два байта.
  max_body_bytes: 8MiB
  # Предел одновременной обработки. При достижении сервис отвечает 429
  # с Retry-After вместо накопления очереди.
  max_concurrent: 1024
  read_timeout: 5s
  # Должен превышать llm.timeout: иначе сервер оборвёт запись ответа раньше,
  # чем модель успеет ответить, и продуктовый прокси будет рвать длинные
  # запросы. Контракт /process этим не затронут — он модель не вызывает.
  write_timeout: 75s
  idle_timeout: 60s
  # Бюджет локальной обработки: детекция, политика, маскирование, запись
  # соответствий. Ожидание модели сюда не входит — оно ограничено llm.timeout,
  # и поэтому write_timeout считается от него, а не от этого предела.
  # Для /process это весь запрос целиком: модель там не вызывается, и предел
  # заведомо меньше 10 с таймаута проверяющей системы.
  request_timeout: 9s
  shutdown_timeout: 10s

store:
  # Срок жизни соответствия «payload_id → оригинал». Выбран нами: верхняя
  # граница паузы между маскированием и демаскированием не задана.
  ttl: 30m
  max_entries: 2000000
  # 1 ГиБ — десятикратный запас к ожидаемым ста мегабайтам пятиминутного
  # прогона. Большее значение под синтетической нагрузкой выводило пик RSS
  # за предел памяти контейнера — измерено, см. docs/spec/PERFORMANCE.md §7.1.
  max_bytes: 1GiB
  sweep_interval: 1m

llm:
  # alfagen — реальный вызов модели, stub — демонстрационный ответ без сети.
  #
  # Сертификат провайдера, истёкший 22.09.2026, обновлён и действует до
  # 01.09.2027. Цепочка доверенная, проверено из Go. Обход проверки
  # сертификата не понадобился и в коде отсутствует.
  #
  # Режим stub сохранён как страховка демонстрации от сетевых сюрпризов:
  # переключение — правка одной строки и перезагрузка по сигналу.
  #
  # На контракт автопроверки режим не влияет: POST /process модель не вызывает.
  mode: alfagen
  base_url: https://alfagen.alfabank.ru/continue-dev/v1
  model: deepseek-ai/DeepSeek-V4-Flash-0731
  timeout: 60s
  api_key_env: ALFAGEN_API_KEY

detection:
  # balanced — достоверные и сильные кандидаты маскируются всегда,
  #            слабые — только внутри кластера других ПД;
  # strict   — только достоверные и сильные, слабые не маскируются
  #            и внутри кластера: меньше избыточности, ниже сокрытие
  #            (замер — docs/spec/QUALITY.md §9.2);
  # paranoid — всё, что совпало по форме.
  # Профиль потребителя перекрывает это значение.
  profile: balanced
  max_spans: 20000

logging:
  level: info
  format: json

consumers:
  # Потребитель по умолчанию: применяется к запросам без ключа, то есть
  # к контракту автопроверки POST /process. Его соответствия изолированы
  # от продуктовых потребителей.
  - id: benchmark
    enabled: true
    types: [all]
    demask: true
    masking: true
    profile: balanced
    mask:
      default: placeholder

  # Демонстрационный потребитель. Существует, чтобы проверяющий мог запустить
  # сервис по README и сразу открыть стенд на http://localhost:8080/ — без
  # настройки переменных окружения.
  #
  # Ключ задан прямо здесь намеренно и только для этого случая. Переменная
  # DEMO_API_KEY, если она задана, перекрывает это значение. Рабочие ключи
  # так задавать нельзя: конфигурация попадает в репозиторий и в архив сдачи.
  - id: demo
    enabled: true
    api_key_env: DEMO_API_KEY
    api_key: demo-key-for-jury
    types: [all]
    demask: true
    masking: true
    profile: balanced
    mask:
      default: placeholder
    # Лимит частоты обращений к модели по этому ключу: token bucket, в
    # среднем rps запросов в секунду и до burst подряд. Действует только на
    # маршруты, которые вызывают модель (/v1/chat/completions и
    # /api/v1/analyze); /process и /api/v1/mask не ограничиваются. Сверх
    # лимита — 429 с Retry-After. Ключ опубликован в README, поэтому без
    # лимита он открывал бы модель команды любому в интернете.
    model_rate:
      rps: 1
      burst: 5

  # Пример продуктового потребителя: маскируются не все типы, номер карты
  # скрывается звёздочками, демаскирование запрещено, пин-код маскируется
  # только вместе с номером карты.
  - id: crm
    enabled: true
    api_key_env: CRM_API_KEY
    # Демонстрационный ключ. Без него на стенде нельзя сравнить политики двух
    # потребителей, а это и есть доказательство гибкости настройки.
    api_key: crm-key-for-jury
    types:
      - full_name
      - birth_date
      - phone
      - email
      - address
      - card_number
      - cvv
      - pin
      - inn
    demask: false
    masking: true
    profile: balanced
    mask:
      default: placeholder
      per_type:
        card_number: asterisks
        phone: asterisks
    combinations:
      - mask: [pin]
        only_with: [card_number]
      - mask: [cvv]
        only_with: [card_number]
    # Ключ тоже опубликован — лимит тот же, что у demo.
    model_rate:
      rps: 1
      burst: 5

  # Две политики для стенда, чтобы все четыре стратегии были видны вживую:
  # токен без типа данных и правдоподобная синтетика вместо значений.
  # Отдельных ключей у них нет: на стенде политику выбирает ключ demo, а
  # право восстановления берётся от ключа, а не от выбранной политики (T-56).
  - id: demo-token
    enabled: true
    api_key_env: DEMO_TOKEN_API_KEY
    types: [all]
    demask: true
    masking: true
    profile: balanced
    mask:
      default: token
    model_rate:
      rps: 1
      burst: 5

  - id: demo-synthetic
    enabled: true
    api_key_env: DEMO_SYNTHETIC_API_KEY
    types: [all]
    demask: true
    masking: true
    profile: balanced
    mask:
      default: synthetic
    model_rate:
      rps: 1
      burst: 5

  # Потребитель, которому маскирование отключено административно.
  # Отключение — только явной настройкой; при отказе защиты оно никогда
  # не включается само.
  - id: internal-analytics
    enabled: false
    api_key_env: ANALYTICS_API_KEY
    types: [all]
    demask: false
    masking: false
