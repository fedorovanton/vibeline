# Настройки статического анализа (SonarQube / SonarScanner).
#
# Разметка исходников, а не подавление правил: здесь не отключено ни одно
# правило и нет ни одного sonar.issue.ignore.*. Файл говорит анализатору,
# что в репозитории является кодом сервиса, что — тестами, а что — не кодом.

sonar.projectKey=ai-gateway
sonar.projectName=ai-gateway
sonar.sourceEncoding=UTF-8

# Код сервиса: cmd/, internal/, web/ — всё, что собирается в бинарник.
sonar.sources=.

# Тесты Go лежат рядом с кодом (*_test.go) и анализируются как тесты, а не
# как код сервиса. Один файл не может быть одновременно и тем и другим,
# поэтому те же шаблоны стоят в sonar.exclusions ниже.
sonar.tests=.
sonar.test.inclusions=**/*_test.go,**/testdata/**

# Не код сервиса:
#   tools/   — отдельные Go-модули разработчика (генератор синтетического
#              корпуса, замер качества, нагрузочный прогон); в бинарник
#              сервиса не входят и в рантайме не работают;
#   docs/, tasks/ — документация и доска задач;
#   deploy/certs/ — открытые корневые сертификаты;
#   dist/, bin/, reports/ — артефакты сборки и прогонов.
sonar.exclusions=**/*_test.go,**/testdata/**,tools/**,docs/**,tasks/**,deploy/certs/**,dist/**,bin/**,reports/**
sonar.cpd.exclusions=**/*_test.go
